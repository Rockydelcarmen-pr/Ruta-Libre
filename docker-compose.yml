services:
  db:
    image: postgis/postgis:16-3.4
    container_name: protest-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: protest
      POSTGRES_PASSWORD: protest
      POSTGRES_DB: protest_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protest -d protest_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
